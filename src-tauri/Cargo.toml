[package]
name = "modelador"
version = "0.1.0"
description = "Runtime nativo local para Modelador"
edition = "2021"
rust-version = "1.97.1"

[lib]
name = "modelador_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.0.2", features = [] }
tauri-utils = "=2.0.2"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "=2.0.2", features = [] }
tauri-plugin-dialog = "=2.0.1"
# Tauri 2 usa rangos semver amplios; se fija el último runtime anterior a la
# migración de Wry 0.46 hacia objc2, incompatible con el macOS 11 objetivo (D-040).
tauri-runtime = "=2.0.1"
tauri-runtime-wry = "=2.0.1"
wry = { version = "=0.44.1", default-features = false }
